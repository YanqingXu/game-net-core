name: Optional bounded standard KCP
on:
  workflow_dispatch:
    inputs:
      c4_soak:
        description: Run the 30-minute KCP-C4 Release soak on Windows and Linux
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['src/**','include/**','tests/**','third_party/kcp/**','cmake/**','tools/**','benchmarks/kcp_validation/**','api/public_api_manifest.json','CMakeLists.txt','intents/modules/kcp_transport.intent.md','intents/usecases/kcp_capacity_endurance.intent.md','rules/**','.github/workflows/kcp.yml']
  pull_request:
    branches: [main]
    paths: ['src/**','include/**','tests/**','third_party/kcp/**','cmake/**','tools/**','benchmarks/kcp_validation/**','api/public_api_manifest.json','CMakeLists.txt','intents/modules/kcp_transport.intent.md','intents/usecases/kcp_capacity_endurance.intent.md','rules/**','.github/workflows/kcp.yml']
permissions:
  contents: read
concurrency:
  group: kcp-${{ inputs.c4_soak && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  c4-soak:
    name: C4 Release endurance (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.c4_soak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check endurance evidence contracts
        run: python tests/ci/test_kcp_capacity_endurance.py
      - name: Run the uninterrupted Release soak
        run: python tools/run_kcp_capacity_endurance.py --profile release --mode soak --build-dir build-kcp-soak --output out/kcp-c4-soak
      - name: Read back raw endurance evidence
        run: python tools/run_kcp_capacity_endurance.py --verify-output out/kcp-c4-soak
      - name: Retain raw endurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcp-c4-soak-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/kcp-c4-soak/
          if-no-files-found: error
          retention-days: 14
  clang-tsan-full:
    name: Clang 18 TSan full suite and allocation controls
    if: github.event_name != 'workflow_dispatch' || !inputs.c4_soak
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GAMENET_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: YanqingXu/mini_trantor
          ref: 3eba368475a68f677aae920d4f299b155db23d57
          path: mini_trantor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Clang toolchain and complete runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev ninja-build
      - name: Configure TSan address space
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Verify full-gate rejection contracts
        run: |
          python3 tests/ci/test_kcp_workflow.py
          python3 tests/ci/test_clang_tsan_gate.py
          python3 tests/ci/test_kcp_capacity_endurance.py
      - name: Run all 143 tests and allocator detection controls
        run: |
          python3 tests/ci/run_clang_tsan_gate.py --compiler clang++-18 --build-dir build-clang-tsan --output out/clang-tsan-evidence
      - name: Independently read back full-gate evidence
        run: |
          python3 tests/ci/run_clang_tsan_gate.py --verify-output out/clang-tsan-evidence
      - name: Run separate C4 Clang TSan fault and capacity contracts
        run: |
          python3 tools/run_kcp_capacity_endurance.py --profile tsan --compiler clang++-18 --build-dir build-clang-tsan --output out/kcp-c4-clang-tsan
          python3 tools/run_kcp_capacity_endurance.py --verify-output out/kcp-c4-clang-tsan
      - name: Retain C4 Clang TSan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcp-c4-clang-tsan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/kcp-c4-clang-tsan/
          if-no-files-found: error
          retention-days: 14
      - name: Retain full Clang TSan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tsan-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/clang-tsan-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  kcp:
    name: KCP (${{ matrix.lane }})
    if: github.event_name != 'workflow_dispatch' || !inputs.c4_soak
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: linux-release
            os: ubuntu-24.04
            profile: release
          - lane: linux-asan-ubsan
            os: ubuntu-24.04
            profile: asan
          - lane: linux-tsan
            os: ubuntu-24.04
            profile: tsan
          - lane: windows-release
            os: windows-latest
            profile: release
          - lane: windows-asan
            os: windows-latest
            profile: asan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          repository: YanqingXu/mini_trantor
          ref: 3eba368475a68f677aae920d4f299b155db23d57
          path: mini_trantor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure TSan address space
        if: matrix.profile == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Verify KCP intent and evidence guards
        run: |
          python tests/ci/test_kcp_workflow.py
          python tests/ci/kcp_examples.py --self-test
          python tests/ci/test_kcp_fuzz.py
          python tests/ci/test_kcp_capacity_endurance.py
          python tests/cmake/test_kcp_validation_contract.py
          python tests/scope/test_intent_semantics.py --with-kcp
      - name: Verify contracts, independent upstream peers and packages
        run: |
          python tests/ci/run_kcp_contracts.py --profile '${{ matrix.profile }}' --build-dir build-kcp --output out/kcp-evidence
      - name: Read back evidence
        run: python tests/ci/run_kcp_contracts.py --verify-output out/kcp-evidence
      - name: Run C4 capacity, fault recovery and zero-residual smoke
        run: |
          python tools/run_kcp_capacity_endurance.py --profile '${{ matrix.profile }}' --build-dir build-kcp --output out/kcp-c4-evidence
          python tools/run_kcp_capacity_endurance.py --verify-output out/kcp-c4-evidence
      - name: Verify physical install isolation with C4 enabled
        run: |
          cmake --install build-kcp --config ${{ matrix.profile == 'release' && 'Release' || 'Debug' }} --prefix out/kcp-c4-install
          python tests/cmake/test_kcp_validation_contract.py --installed-prefix out/kcp-c4-install
      - name: Retain C4 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcp-c4-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/kcp-c4-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Retain KCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcp-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/kcp-evidence/
          if-no-files-found: error
          retention-days: 14
  fuzz:
    name: KCP protocol and session fuzz
    if: github.event_name != 'workflow_dispatch' || !inputs.c4_soak
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure bounded instrumented KCP
        run: cmake -S . -B build-kcp-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DGAMENET_ENABLE_UDP=ON -DGAMENET_ENABLE_KCP=ON -DGAMENET_ENABLE_TLS=OFF -DGAMENET_ENABLE_WEBSOCKET=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON -DGAMENET_BUILD_FUZZING=ON -DGAMENET_BUILD_TESTING=OFF -DGAMENET_ENABLE_ASAN_UBSAN=ON
      - name: Build both KCP fuzz targets
        run: cmake --build build-kcp-fuzz --parallel 2 --target gamenet_fuzz_kcp_protocol gamenet_fuzz_kcp_session
      - name: Execute and independently verify bounded fuzz
        run: |
          python3 tests/ci/run_kcp_fuzz.py --kind protocol --build-dir build-kcp-fuzz --output out/kcp-protocol-fuzz
          python3 tests/ci/run_kcp_fuzz.py --verify-output out/kcp-protocol-fuzz
          python3 tests/ci/run_kcp_fuzz.py --kind session --build-dir build-kcp-fuzz --output out/kcp-session-fuzz
          python3 tests/ci/run_kcp_fuzz.py --verify-output out/kcp-session-fuzz
      - name: Retain raw KCP fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcp-fuzz-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/kcp-protocol-fuzz/
            out/kcp-session-fuzz/
          if-no-files-found: error
          retention-days: 14
