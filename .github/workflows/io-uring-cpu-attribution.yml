name: io_uring CPU attribution

on:
  push:
    branches: [codex/io-uring-cpu-attribution]

permissions:
  contents: read

jobs:
  native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PACKAGE_REVISION: 63fe9f16733c8bcdd52b23fe401466f78d28c03d
    steps:
      - name: Check out the standalone profiler and consumer
        uses: actions/checkout@v4
        with:
          path: attribution-source
          persist-credentials: false
      - name: Check out the package source at the main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_REVISION }}
          path: package-source
          persist-credentials: false
      - name: Provision native CPU and syscall observers
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/io-uring-cpu/build"
          mkdir -p "$logs"
          packages=()
          command -v strace >/dev/null || packages+=(strace)
          if ! perf version >/dev/null 2>&1 && ! compgen -G '/usr/lib/linux-tools/*/perf' >/dev/null; then
            packages+=(linux-tools-generic)
          fi
          {
            uname -a
            if (( ${#packages[@]} )); then
              sudo -n apt-get update -qq
              sudo -n apt-get install -y --no-install-recommends "${packages[@]}"
            fi
            strace --version
            cat /proc/sys/kernel/perf_event_paranoid
          } 2>&1 | tee "$logs/observer-preflight.log"
      - name: Build the Release package and installed consumer
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/io-uring-cpu/build"
          prefix="$RUNNER_TEMP/package-prefix"
          cmake -S package-source -B "$RUNNER_TEMP/package-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGAMENET_ENABLE_EXPERIMENTAL=ON \
            -DGAMENET_BUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_PREFIX="$prefix" 2>&1 | tee "$logs/package-configure.log"
          cmake --build "$RUNNER_TEMP/package-build" --parallel 2 2>&1 | tee "$logs/package-build.log"
          cmake --install "$RUNNER_TEMP/package-build" 2>&1 | tee "$logs/package-install.log"
          cmake -S attribution-source/benchmarks/io_uring/installed_acceptance \
            -B "$RUNNER_TEMP/consumer-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGameNetCore_DIR="$prefix/lib/cmake/GameNetCore" 2>&1 | tee "$logs/consumer-configure.log"
          cmake --build "$RUNNER_TEMP/consumer-build" --parallel 2 --verbose 2>&1 | tee "$logs/consumer-build.log"
      - name: Run the longer baseline and owner-thread profiling
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 -B attribution-source/benchmarks/io_uring/installed_acceptance/cpu_attribution.py \
            --source package-source --expected-source "$PACKAGE_REVISION" \
            --package-build "$RUNNER_TEMP/package-build" --consumer-build "$RUNNER_TEMP/consumer-build" \
            --prefix "$RUNNER_TEMP/package-prefix" --output "$RUNNER_TEMP/io-uring-cpu"
      - name: Replay the raw evidence independently
        run: |
          python3 -B attribution-source/benchmarks/io_uring/installed_acceptance/cpu_attribution.py \
            --verify-output "$RUNNER_TEMP/io-uring-cpu"
      - name: Retain metrics, raw profiles, and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: io-uring-cpu-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/io-uring-cpu
          if-no-files-found: error
          retention-days: 30
