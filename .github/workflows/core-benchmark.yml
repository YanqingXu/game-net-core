name: core-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GAMENET_PERFORMANCE_BASELINE_SHA: 2b1be4343f7c478eb40542451f30aad8ca474003
  GAMENET_CORE_CAPACITY_BASELINE_SHA: bbcdd8af2e736d8f8ed53d49e787f14d7f7cb043

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-release-benchmark:
    name: Linux Release epoll benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout performance baseline
        uses: actions/checkout@v4
        with:
          ref: 2b1be4343f7c478eb40542451f30aad8ca474003
          path: performance-baseline
          persist-credentials: false

      - name: Checkout Core capacity baseline
        uses: actions/checkout@v4
        with:
          ref: bbcdd8af2e736d8f8ed53d49e787f14d7f7cb043
          path: core-capacity-baseline
          persist-credentials: false

      - name: Record Phase 4 benchmark toolchain evidence
        run: |
          set -euo pipefail
          mkdir -p phase4-benchmark-results
          {
            cmake --version
            c++ --version
            python3 --version
          } 2>&1 | tee phase4-benchmark-results/toolchain.txt

      - name: Check benchmark contract
        run: |
          python3 tests/cmake/test_core_benchmark_contract.py
          python3 tests/cmake/test_phase4_benchmark_contract.py
          python3 tests/ci/test_performance_regression.py
          python3 tests/ci/test_core_capacity_matrix.py
          python3 tests/ci/test_endurance_gate.py

      - name: Configure
        run: >
          cmake -S . -B build-benchmark
          -DCMAKE_BUILD_TYPE=Release
          -DGAMENET_BUILD_TESTING=OFF
          -DGAMENET_BUILD_BENCHMARKS=ON
          -DGAMENET_ENABLE_TLS=OFF
          -DGAMENET_ENABLE_EXPERIMENTAL=OFF

      - name: Build
        run: >
          cmake --build build-benchmark
          --target gamenet_core_benchmark gamenet_phase4_benchmark --parallel

      - name: Configure and build performance baseline
        run: |
          set -euo pipefail
          cmake -S performance-baseline -B build-benchmark-baseline \
            -DCMAKE_BUILD_TYPE=Release \
            -DGAMENET_BUILD_TESTING=OFF \
            -DGAMENET_BUILD_BENCHMARKS=ON \
            -DGAMENET_ENABLE_TLS=OFF \
            -DGAMENET_ENABLE_EXPERIMENTAL=OFF
          cmake --build build-benchmark-baseline \
            --target gamenet_core_benchmark gamenet_phase4_benchmark --parallel

      - name: Configure and build Core capacity baseline
        run: |
          set -euo pipefail
          cmake -S core-capacity-baseline -B build-core-capacity-baseline \
            -DCMAKE_BUILD_TYPE=Release \
            -DGAMENET_BUILD_TESTING=OFF \
            -DGAMENET_BUILD_BENCHMARKS=ON \
            -DGAMENET_ENABLE_TLS=OFF \
            -DGAMENET_ENABLE_EXPERIMENTAL=OFF
          cmake --build build-core-capacity-baseline \
            --target gamenet_core_benchmark --parallel

      - name: Run paired interleaved performance matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_paired_performance_matrix.py \
            --candidate-core-executable build-benchmark/benchmarks/gamenet_core_benchmark \
            --candidate-phase4-executable build-benchmark/benchmarks/gamenet_phase4_benchmark \
            --baseline-core-executable build-benchmark-baseline/benchmarks/gamenet_core_benchmark \
            --baseline-phase4-executable build-benchmark-baseline/benchmarks/gamenet_phase4_benchmark \
            --candidate-output-root phase4-benchmark-results/performance-samples/candidate \
            --baseline-output-root phase4-benchmark-results/performance-samples/baseline \
            --candidate-canonical-core-dir benchmark-results \
            --candidate-canonical-phase4-dir phase4-benchmark-results \
            --platform linux --backend epoll --build-type Release \
            --candidate-sha "${GITHUB_SHA}" \
            --baseline-sha "${GAMENET_PERFORMANCE_BASELINE_SHA}" \
            --repetitions 3

      - name: Validate JSON artifacts
        run: |
          python3 tools/validate_core_benchmark.py \
            --input-dir benchmark-results \
            --platform linux --backend epoll --build-type Release

      - name: Run paired interleaved Core capacity matrix
        run: |
          set -euo pipefail
          python3 tools/run_paired_performance_matrix.py \
            --matrix-profile core-capacity \
            --candidate-core-executable build-benchmark/benchmarks/gamenet_core_benchmark \
            --baseline-core-executable build-core-capacity-baseline/benchmarks/gamenet_core_benchmark \
            --candidate-output-root phase4-benchmark-results/core-capacity-samples/candidate \
            --baseline-output-root phase4-benchmark-results/core-capacity-samples/baseline \
            --platform linux --backend epoll --build-type Release \
            --candidate-sha "${GITHUB_SHA}" \
            --baseline-sha "${GAMENET_CORE_CAPACITY_BASELINE_SHA}" \
            --repetitions 3

      - name: Verify Core hard-limit benchmark semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase4-benchmark-results/core-v2-semantics
          ./build-benchmark/benchmarks/gamenet_core_benchmark \
            --scenario slow-client --connections 2 --threads 1 \
            --slow-bytes 33554432 --high-water 65536 \
            --settle-ms 100 --timeout-ms 30000 \
            > phase4-benchmark-results/core-v2-semantics/slow-client-rejection.json
          python3 tools/validate_core_benchmark.py \
            --input phase4-benchmark-results/core-v2-semantics/slow-client-rejection.json \
            --platform linux --backend epoll --build-type Release \
            --scenario slow-client --expected-connections 2 \
            --expected-slow-bytes 33554432 --require-overload

      - name: Validate Phase 4 JSON artifacts
        run: |
          set -euo pipefail
          python3 tools/validate_phase4_benchmark.py \
            --input-dir phase4-benchmark-results \
            --platform linux \
            --backend epoll \
            --build-type Release \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --job "${GITHUB_JOB}" \
            --artifact-name "phase4-benchmark-${GITHUB_JOB}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --manifest-output phase4-benchmark-results/evidence-manifest.json

      - name: Enforce same-runner performance budgets
        run: |
          set -euo pipefail
          python3 tools/compare_performance_regression.py \
            --baseline-root phase4-benchmark-results/performance-samples/baseline \
            --candidate-root phase4-benchmark-results/performance-samples/candidate \
            --budget benchmarks/performance_regression_budgets.json \
            --baseline-sha "${GAMENET_PERFORMANCE_BASELINE_SHA}" \
            --candidate-sha "${GITHUB_SHA}" \
            --platform linux --backend epoll \
            --output phase4-benchmark-results/performance-regression.json

      - name: Enforce same-runner Core capacity budgets
        run: |
          set -euo pipefail
          python3 tools/compare_performance_regression.py \
            --baseline-root phase4-benchmark-results/core-capacity-samples/baseline \
            --candidate-root phase4-benchmark-results/core-capacity-samples/candidate \
            --budget benchmarks/core_capacity_regression_budgets.json \
            --baseline-sha "${GAMENET_CORE_CAPACITY_BASELINE_SHA}" \
            --candidate-sha "${GITHUB_SHA}" \
            --platform linux --backend epoll \
            --output phase4-benchmark-results/core-capacity-regression.json

      - name: Evaluate Linux accept topology
        run: |
          set -euo pipefail
          python3 tools/evaluate_core_accept_topology.py \
            --input-root phase4-benchmark-results/core-capacity-samples/candidate \
            --candidate-sha "${GITHUB_SHA}" \
            --output phase4-benchmark-results/core-accept-topology-decision.json

      - name: Write Linux Phase 4 benchmark job evidence
        if: always()
        env:
          GAMENET_CI_CANDIDATE_SHA: "${{ github.sha }}"
          GAMENET_CI_MERGE_OR_CURRENT_SHA: "${{ github.sha }}"
          GAMENET_CI_STATUS: "${{ job.status }}"
        run: |
          python3 tools/write_ci_evidence.py \
            --evidence-root phase4-benchmark-results \
            --output phase4-benchmark-results/job-manifest.json \
            --artifact-name 'phase4-benchmark-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}' \
            --require-canonical-artifact-name \
            --command 'cmake -S . -B build-benchmark -DCMAKE_BUILD_TYPE=Release -DGAMENET_BUILD_TESTING=OFF -DGAMENET_BUILD_BENCHMARKS=ON -DGAMENET_ENABLE_TLS=OFF -DGAMENET_ENABLE_EXPERIMENTAL=OFF' \
            --command 'cmake --build build-benchmark --target gamenet_core_benchmark gamenet_phase4_benchmark --parallel' \
            --command 'python3 tools/run_paired_performance_matrix.py --candidate-and-baseline --repetitions 3' \
            --command 'python3 tools/run_paired_performance_matrix.py --matrix-profile core-capacity --candidate-and-baseline --repetitions 3' \
            --command 'gamenet_core_benchmark --scenario slow-client --connections 2 --slow-bytes 33554432' \
            --command 'python3 tools/validate_core_benchmark.py --scenario slow-client --require-overload' \
            --command 'python3 tools/compare_performance_regression.py --platform linux --backend epoll' \
            --command 'python3 tools/compare_performance_regression.py --budget benchmarks/core_capacity_regression_budgets.json --platform linux --backend epoll' \
            --command 'python3 tools/evaluate_core_accept_topology.py --platform linux --backend epoll' \
            --command 'python3 tools/validate_phase4_benchmark.py --platform linux --backend epoll --build-type Release'

      - name: Upload Linux raw JSON
        uses: actions/upload-artifact@v4
        with:
          name: core-benchmark-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Linux Phase 4 raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-benchmark-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase4-benchmark-results/
          if-no-files-found: error
          retention-days: 90

  windows-release-benchmark:
    name: Windows Release IOCP benchmark
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout performance baseline
        uses: actions/checkout@v4
        with:
          ref: 2b1be4343f7c478eb40542451f30aad8ca474003
          path: performance-baseline
          persist-credentials: false

      - name: Checkout Core capacity baseline
        uses: actions/checkout@v4
        with:
          ref: bbcdd8af2e736d8f8ed53d49e787f14d7f7cb043
          path: core-capacity-baseline
          persist-credentials: false

      - name: Record Phase 4 benchmark toolchain evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force phase4-benchmark-results | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolchain = @(
            cmake --version
            python --version
            "Visual Studio installation: $installationPath"
            "MSVC tools version:"
            Get-Content (Join-Path $installationPath "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt")
          )
          $toolchain | Tee-Object -FilePath phase4-benchmark-results/toolchain.txt

      - name: Check benchmark contract
        shell: pwsh
        run: |
          python tests/cmake/test_core_benchmark_contract.py
          python tests/cmake/test_phase4_benchmark_contract.py
          python tests/ci/test_performance_regression.py
          python tests/ci/test_core_capacity_matrix.py
          python tests/ci/test_endurance_gate.py

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-benchmark-windows
          -G "Visual Studio 18 2026"
          -A x64
          -DGAMENET_BUILD_TESTING=OFF
          -DGAMENET_BUILD_BENCHMARKS=ON
          -DGAMENET_ENABLE_TLS=OFF
          -DGAMENET_ENABLE_EXPERIMENTAL=OFF

      - name: Build
        shell: pwsh
        run: >
          cmake --build build-benchmark-windows --config Release
          --target gamenet_core_benchmark gamenet_phase4_benchmark --parallel

      - name: Configure and build performance baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S performance-baseline -B build-benchmark-baseline-windows `
            -G "Visual Studio 18 2026" -A x64 `
            -DGAMENET_BUILD_TESTING=OFF `
            -DGAMENET_BUILD_BENCHMARKS=ON `
            -DGAMENET_ENABLE_TLS=OFF `
            -DGAMENET_ENABLE_EXPERIMENTAL=OFF
          if ($LASTEXITCODE -ne 0) { throw "baseline configure failed" }
          cmake --build build-benchmark-baseline-windows --config Release `
            --target gamenet_core_benchmark gamenet_phase4_benchmark --parallel
          if ($LASTEXITCODE -ne 0) { throw "baseline build failed" }

      - name: Configure and build Core capacity baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S core-capacity-baseline -B build-core-capacity-baseline-windows `
            -G "Visual Studio 18 2026" -A x64 `
            -DGAMENET_BUILD_TESTING=OFF `
            -DGAMENET_BUILD_BENCHMARKS=ON `
            -DGAMENET_ENABLE_TLS=OFF `
            -DGAMENET_ENABLE_EXPERIMENTAL=OFF
          if ($LASTEXITCODE -ne 0) { throw "capacity baseline configure failed" }
          cmake --build build-core-capacity-baseline-windows --config Release `
            --target gamenet_core_benchmark --parallel
          if ($LASTEXITCODE -ne 0) { throw "capacity baseline build failed" }

      - name: Run paired interleaved performance matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/run_paired_performance_matrix.py `
            --candidate-core-executable build-benchmark-windows/benchmarks/Release/gamenet_core_benchmark.exe `
            --candidate-phase4-executable build-benchmark-windows/benchmarks/Release/gamenet_phase4_benchmark.exe `
            --baseline-core-executable build-benchmark-baseline-windows/benchmarks/Release/gamenet_core_benchmark.exe `
            --baseline-phase4-executable build-benchmark-baseline-windows/benchmarks/Release/gamenet_phase4_benchmark.exe `
            --candidate-output-root phase4-benchmark-results/performance-samples/candidate `
            --baseline-output-root phase4-benchmark-results/performance-samples/baseline `
            --candidate-canonical-core-dir benchmark-results `
            --candidate-canonical-phase4-dir phase4-benchmark-results `
            --platform windows --backend iocp --build-type Release `
            --candidate-sha "$env:GITHUB_SHA" `
            --baseline-sha "$env:GAMENET_PERFORMANCE_BASELINE_SHA" `
            --repetitions 3
          if ($LASTEXITCODE -ne 0) { throw "paired performance matrix failed" }

      - name: Validate Core JSON artifacts
        shell: pwsh
        run: |
          python tools/validate_core_benchmark.py `
            --input-dir benchmark-results `
            --platform windows --backend iocp --build-type Release
          if ($LASTEXITCODE -ne 0) { throw "Core benchmark artifact validation failed" }

      - name: Run paired interleaved Core capacity matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/run_paired_performance_matrix.py `
            --matrix-profile core-capacity `
            --candidate-core-executable build-benchmark-windows/benchmarks/Release/gamenet_core_benchmark.exe `
            --baseline-core-executable build-core-capacity-baseline-windows/benchmarks/Release/gamenet_core_benchmark.exe `
            --candidate-output-root phase4-benchmark-results/core-capacity-samples/candidate `
            --baseline-output-root phase4-benchmark-results/core-capacity-samples/baseline `
            --platform windows --backend iocp --build-type Release `
            --candidate-sha "$env:GITHUB_SHA" `
            --baseline-sha "$env:GAMENET_CORE_CAPACITY_BASELINE_SHA" `
            --repetitions 3
          if ($LASTEXITCODE -ne 0) { throw "paired Core capacity matrix failed" }

      - name: Verify Core hard-limit benchmark semantics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force `
            phase4-benchmark-results/core-v2-semantics | Out-Null
          $exe = Resolve-Path `
            build-benchmark-windows/benchmarks/Release/gamenet_core_benchmark.exe
          $json = & $exe `
            --scenario slow-client --connections 2 --threads 1 `
            --slow-bytes 33554432 --high-water 65536 `
            --settle-ms 100 --timeout-ms 30000
          if ($LASTEXITCODE -ne 0) { throw "hard-limit semantic benchmark failed" }
          $path = "phase4-benchmark-results/core-v2-semantics/slow-client-rejection.json"
          Set-Content -LiteralPath $path -Value $json -Encoding utf8 -NoNewline
          python tools/validate_core_benchmark.py `
            --input $path `
            --platform windows --backend iocp --build-type Release `
            --scenario slow-client --expected-connections 2 `
            --expected-slow-bytes 33554432 --require-overload
          if ($LASTEXITCODE -ne 0) { throw "invalid hard-limit semantic benchmark result" }

      - name: Validate Phase 4 JSON artifacts
        shell: pwsh
        run: |
          python tools/validate_phase4_benchmark.py `
            --input-dir phase4-benchmark-results `
            --platform windows `
            --backend iocp `
            --build-type Release `
            --commit-sha "$env:GITHUB_SHA" `
            --run-id "$env:GITHUB_RUN_ID" `
            --job "$env:GITHUB_JOB" `
            --artifact-name "phase4-benchmark-$($env:GITHUB_JOB)-$($env:GITHUB_SHA)-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)" `
            --manifest-output phase4-benchmark-results/evidence-manifest.json

      - name: Enforce same-runner performance budgets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/compare_performance_regression.py `
            --baseline-root phase4-benchmark-results/performance-samples/baseline `
            --candidate-root phase4-benchmark-results/performance-samples/candidate `
            --budget benchmarks/performance_regression_budgets.json `
            --baseline-sha "$env:GAMENET_PERFORMANCE_BASELINE_SHA" `
            --candidate-sha "$env:GITHUB_SHA" `
            --platform windows --backend iocp `
            --output phase4-benchmark-results/performance-regression.json
          if ($LASTEXITCODE -ne 0) { throw "performance regression budget failed" }

      - name: Enforce same-runner Core capacity budgets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/compare_performance_regression.py `
            --baseline-root phase4-benchmark-results/core-capacity-samples/baseline `
            --candidate-root phase4-benchmark-results/core-capacity-samples/candidate `
            --budget benchmarks/core_capacity_regression_budgets.json `
            --baseline-sha "$env:GAMENET_CORE_CAPACITY_BASELINE_SHA" `
            --candidate-sha "$env:GITHUB_SHA" `
            --platform windows --backend iocp `
            --output phase4-benchmark-results/core-capacity-regression.json
          if ($LASTEXITCODE -ne 0) { throw "Core capacity regression budget failed" }

      - name: Write Windows Phase 4 benchmark job evidence
        if: always()
        shell: pwsh
        env:
          GAMENET_CI_CANDIDATE_SHA: "${{ github.sha }}"
          GAMENET_CI_MERGE_OR_CURRENT_SHA: "${{ github.sha }}"
          GAMENET_CI_STATUS: "${{ job.status }}"
        run: |
          python tools/write_ci_evidence.py `
            --evidence-root phase4-benchmark-results `
            --output phase4-benchmark-results/job-manifest.json `
            --artifact-name 'phase4-benchmark-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}' `
            --require-canonical-artifact-name `
            --command 'cmake -S . -B build-benchmark-windows -G Visual Studio 18 2026 -A x64 -DGAMENET_BUILD_TESTING=OFF -DGAMENET_BUILD_BENCHMARKS=ON -DGAMENET_ENABLE_TLS=OFF -DGAMENET_ENABLE_EXPERIMENTAL=OFF' `
            --command 'cmake --build build-benchmark-windows --config Release --target gamenet_core_benchmark gamenet_phase4_benchmark --parallel' `
            --command 'python tools/run_paired_performance_matrix.py --candidate-and-baseline --repetitions 3' `
            --command 'python tools/run_paired_performance_matrix.py --matrix-profile core-capacity --candidate-and-baseline --repetitions 3' `
            --command 'gamenet_core_benchmark --scenario slow-client --connections 2 --slow-bytes 33554432' `
            --command 'python tools/validate_core_benchmark.py --scenario slow-client --require-overload' `
            --command 'python tools/compare_performance_regression.py --platform windows --backend iocp' `
            --command 'python tools/compare_performance_regression.py --budget benchmarks/core_capacity_regression_budgets.json --platform windows --backend iocp' `
            --command 'python tools/validate_phase4_benchmark.py --platform windows --backend iocp --build-type Release'

      - name: Upload Windows raw JSON
        uses: actions/upload-artifact@v4
        with:
          name: core-benchmark-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Windows Phase 4 raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-benchmark-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase4-benchmark-results/
          if-no-files-found: error
          retention-days: 90

  phase4-benchmark-evidence:
    name: Verify paired Phase 4 benchmark evidence
    needs:
      - linux-release-benchmark
      - windows-release-benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require successful benchmark producers
        env:
          LINUX_PRODUCER_RESULT: ${{ needs['linux-release-benchmark'].result }}
          WINDOWS_PRODUCER_RESULT: ${{ needs['windows-release-benchmark'].result }}
        run: |
          if [ "$LINUX_PRODUCER_RESULT" != "success" ] || [ "$WINDOWS_PRODUCER_RESULT" != "success" ]; then
            echo "benchmark producers must both finish successfully: linux=$LINUX_PRODUCER_RESULT windows=$WINDOWS_PRODUCER_RESULT" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Phase 4 benchmark job evidence
        uses: actions/download-artifact@v4
        with:
          pattern: phase4-benchmark-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase4-benchmark-evidence-set
          merge-multiple: false

      - name: Verify paired Phase 4 benchmark evidence
        run: |
          python3 tools/verify_phase4_benchmark_evidence_set.py \
            --input-root phase4-benchmark-evidence-set \
            --output phase4-benchmark-evidence-set/pair-manifest.json

      - name: Upload paired Phase 4 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-benchmark-pair-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase4-benchmark-evidence-set/pair-manifest.json
          if-no-files-found: error
          retention-days: 90
