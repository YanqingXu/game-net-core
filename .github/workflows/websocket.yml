name: Optional bounded WS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','include/**','tests/**','examples/**','cmake/**','tools/**','api/public_api_manifest.json','CMakeLists.txt','intents/modules/websocket.intent.md','rules/**','.github/workflows/websocket.yml']
  pull_request:
    branches: [main]
    paths: ['src/**','include/**','tests/**','examples/**','cmake/**','tools/**','api/public_api_manifest.json','CMakeLists.txt','intents/modules/websocket.intent.md','rules/**','.github/workflows/websocket.yml']
permissions:
  contents: read
concurrency:
  group: websocket-${{ github.ref }}
  cancel-in-progress: true
jobs:
  websocket:
    name: WS (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: linux-release
            os: ubuntu-24.04
            profile: release
          - lane: linux-asan-ubsan
            os: ubuntu-24.04
            profile: asan
          - lane: linux-tsan
            os: ubuntu-24.04
            profile: tsan
          - lane: windows-release
            os: windows-latest
            profile: release
          - lane: windows-asan
            os: windows-latest
            profile: asan
          - lane: linux-fuzz
            os: ubuntu-24.04
            profile: fuzz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          repository: YanqingXu/mini_trantor
          ref: 3eba368475a68f677aae920d4f299b155db23d57
          path: mini_trantor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure TSan address space
        if: matrix.profile == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Install pinned independent interoperability client
        if: matrix.profile != 'fuzz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/websocket-evidence
          python -m pip install --disable-pip-version-check websockets==15.0.1 > out/websocket-evidence/dependency.log 2>&1
      - name: Verify optional intent and exact evidence guards
        run: |
          python tests/ci/test_websocket_workflow.py
          python tests/scope/test_intent_semantics.py --with-websocket
      - name: Build and verify WS contracts, packages and peers
        shell: bash
        run: |
          python tests/ci/run_websocket_contracts.py --profile '${{ matrix.profile }}' --build-dir build-websocket --output out/websocket-evidence
      - name: Retain WS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/websocket-evidence/
          if-no-files-found: error
          retention-days: 14
