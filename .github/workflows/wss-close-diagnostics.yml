name: Manual WSS close diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: WSS close diagnostic (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [release, asan]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $wssRoot = @('C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
            Where-Object { Test-Path -LiteralPath "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $wssRoot) { throw 'OpenSSL development files required' }
          "OPENSSL_ROOT_DIR=$wssRoot" >> $env:GITHUB_ENV
          "$wssRoot\bin" >> $env:GITHUB_PATH
          & "$wssRoot\bin\openssl.exe" version -a
      - run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: Build diagnostic peers
        shell: pwsh
        run: |
          $wssConfig = if ('${{ matrix.profile }}' -eq 'release') { 'Release' } else { 'Debug' }
          $wssAsan = if ('${{ matrix.profile }}' -eq 'asan') { 'ON' } else { 'OFF' }
          cmake -S . -B build-wss-close -A x64 -DGAMENET_ENABLE_TLS=ON -DGAMENET_ENABLE_WEBSOCKET=ON -DGAMENET_ENABLE_UDP=OFF -DGAMENET_BUILD_TESTING=ON -DGAMENET_BUILD_BENCHMARKS=OFF -DGAMENET_BUILD_FUZZING=OFF -DGAMENET_ENABLE_ASAN_UBSAN=$wssAsan -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wssTarget = 'gnt_integration_websocket_tls_' + (python -c 'import hashlib; print(hashlib.sha1(b"integration.websocket_tls.test_websocket_tls_tcp").hexdigest()[:10])')
          cmake --build build-wss-close --config $wssConfig --parallel 2 --target gamenet_websocket_tls_echo_server $wssTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probe strict close with diagnostics
        run: python tests/ci/run_wss_close_probe.py --build-dir build-wss-close --output out/wss-close-diagnostic --profile '${{ matrix.profile }}' --generations 256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wss-close-diagnostic-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/wss-close-diagnostic/
          if-no-files-found: error
