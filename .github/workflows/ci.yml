            --command 'python tools/verify_ctest_inventory.py --test-dir build-windows-release-install-consumer --config Release --expected-total 1 --output ci-evidence/install-consumer-inventory.json' `
            --command 'cmake --build build-windows-release-install-consumer --config Release --parallel' `
            --command 'ctest --test-dir build-windows-release-install-consumer -C Release --output-on-failure --timeout 60 --output-junit $pwd/ci-evidence/install-consumer-junit.xml --output-log $pwd/ci-evidence/install-consumer-ctest.log'

      - name: Upload CI evidence
        id: ci-evidence-upload
        if: always()
        continue-on-error: ${{ env.GAMENET_CI_ARTIFACT_POLICY == 'best-effort' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Report CI evidence upload
        if: always()
        shell: pwsh
        env:
          GAMENET_CI_ARTIFACT_OUTCOME: ${{ steps.ci-evidence-upload.outcome }}
        run: |
          @(
            "## CI evidence upload"
            "- policy: $env:GAMENET_CI_ARTIFACT_POLICY"
            "- outcome: $env:GAMENET_CI_ARTIFACT_OUTCOME"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($env:GAMENET_CI_ARTIFACT_OUTCOME -ne "success") {
            if ($env:GAMENET_CI_ARTIFACT_POLICY -eq "best-effort") {
              Write-Host "::warning::CI evidence upload was unavailable. The job result follows all preceding gates; no retained artifact may be claimed."
            } else {
              Write-Host "::error::Required CI evidence upload failed."
            }
          }

  ci-evidence-set:
    name: Aggregate six-job CI evidence
    if: always()
    needs:
      - linux-cmake
      - linux-asan-ubsan
      - linux-tsan
      - linux-release
      - windows-msvc
      - windows-msvc-release
    runs-on: >-
      ${{ fromJSON(
        vars.GAMENET_CI_RUNNER_MODE == 'self-hosted' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository) &&
        '["self-hosted","linux","x64","gamenet-endurance"]' ||
        '["ubuntu-24.04"]'
      ) }}
    timeout-minutes: 10

    steps:
      - name: Verify six producer job results
        env:
          LINUX_CMAKE_RESULT: ${{ needs['linux-cmake'].result }}
          LINUX_ASAN_UBSAN_RESULT: ${{ needs['linux-asan-ubsan'].result }}
          LINUX_TSAN_RESULT: ${{ needs['linux-tsan'].result }}
          LINUX_RELEASE_RESULT: ${{ needs['linux-release'].result }}
          WINDOWS_MSVC_RESULT: ${{ needs['windows-msvc'].result }}
          WINDOWS_MSVC_RELEASE_RESULT: ${{ needs['windows-msvc-release'].result }}
        run: |
          set -euo pipefail
          failed=0
          check_result() {
            local job_name="$1"
            local job_result="$2"
            echo "${job_name}=${job_result}"
            if [[ "${job_result}" != "success" ]]; then
              echo "::error::${job_name} concluded ${job_result}; all six producer jobs must succeed."
              failed=1
            fi
          }
          check_result linux-cmake "${LINUX_CMAKE_RESULT}"
          check_result linux-asan-ubsan "${LINUX_ASAN_UBSAN_RESULT}"
          check_result linux-tsan "${LINUX_TSAN_RESULT}"
          check_result linux-release "${LINUX_RELEASE_RESULT}"
          check_result windows-msvc "${WINDOWS_MSVC_RESULT}"
          check_result windows-msvc-release "${WINDOWS_MSVC_RELEASE_RESULT}"
          exit "${failed}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download six producer evidence artifacts
        id: producer-evidence-download
        continue-on-error: ${{ env.GAMENET_CI_ARTIFACT_POLICY == 'best-effort' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence-producers
          merge-multiple: false

      - name: Check producer evidence availability
        id: producer-evidence-availability
        if: always()
        env:
          GAMENET_CI_ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.producer-evidence-download.outcome }}
        run: |
          set -euo pipefail
          producer_count=0
          if [[ -d ci-evidence-producers ]]; then
            producer_count="$(
              find ci-evidence-producers -mindepth 1 -maxdepth 1 -type d |
                wc -l |
                tr -d '[:space:]'
            )"
          fi
          {
            echo "## Six-job CI evidence availability"
            echo "- policy: ${GAMENET_CI_ARTIFACT_POLICY}"
            echo "- download outcome: ${GAMENET_CI_ARTIFACT_DOWNLOAD_OUTCOME}"
            echo "- producer directories: ${producer_count}/6"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${GAMENET_CI_ARTIFACT_DOWNLOAD_OUTCOME}" == "success" &&
                "${producer_count}" == "6" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=false" >> "${GITHUB_OUTPUT}"
          if [[ "${GAMENET_CI_ARTIFACT_POLICY}" == "best-effort" ]]; then
            echo "::warning::Complete six-producer artifact evidence is unavailable. Producer job results remain authoritative; no aggregate evidence may be claimed."
            exit 0
          fi
          echo "::error::Required six-producer artifact evidence is unavailable."
          exit 1

      - name: Verify and aggregate six-job evidence
        id: aggregate-evidence-verification
        if: steps.producer-evidence-availability.outputs.available == 'true'
        run: >
          python3 tools/verify_ci_evidence_set.py
          --input-root ci-evidence-producers
          --output ci-evidence-aggregate/manifest.json

      - name: Upload aggregate CI evidence
        id: aggregate-evidence-upload
        if: >-
          always() &&
          steps.aggregate-evidence-verification.outcome == 'success'
        continue-on-error: ${{ env.GAMENET_CI_ARTIFACT_POLICY == 'best-effort' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-set-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence-aggregate/
          if-no-files-found: error
          retention-days: 90

      - name: Report aggregate CI evidence
        if: always()
        env:
          GAMENET_CI_ARTIFACT_AVAILABLE: ${{ steps.producer-evidence-availability.outputs.available }}
          GAMENET_CI_AGGREGATE_VERIFY_OUTCOME: ${{ steps.aggregate-evidence-verification.outcome }}
          GAMENET_CI_AGGREGATE_UPLOAD_OUTCOME: ${{ steps.aggregate-evidence-upload.outcome }}
        run: |
          {
            echo "## Aggregate CI evidence"
            echo "- policy: ${GAMENET_CI_ARTIFACT_POLICY}"
            echo "- complete producer evidence: ${GAMENET_CI_ARTIFACT_AVAILABLE:-false}"
            echo "- verification outcome: ${GAMENET_CI_AGGREGATE_VERIFY_OUTCOME}"
            echo "- upload outcome: ${GAMENET_CI_AGGREGATE_UPLOAD_OUTCOME}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${GAMENET_CI_AGGREGATE_VERIFY_OUTCOME}" == "success" &&
                "${GAMENET_CI_AGGREGATE_UPLOAD_OUTCOME}" != "success" ]]; then
            if [[ "${GAMENET_CI_ARTIFACT_POLICY}" == "best-effort" ]]; then
              echo "::warning::Aggregate CI evidence upload was unavailable. No retained aggregate artifact may be claimed."
            else
              echo "::error::Required aggregate CI evidence upload failed."
            fi
          fi
